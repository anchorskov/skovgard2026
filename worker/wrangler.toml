name = "skovgard2026-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# ---------- Shared defaults ----------
[vars]
# Browsers allowed to call our API
CORS_ORIGINS = "http://localhost:1313,https://skovgard2026.org,https://skovgard2026.pages.dev"
# Hostnames accepted from Turnstile Siteverify
TS_ALLOWED_HOSTNAMES = "localhost,127.0.0.1,skovgard2026.org,www.skovgard2026.org,skovgard2026.pages.dev"

# ---------- Production environment ----------
[env.production]
[env.production.vars]
CORS_ORIGINS = "https://skovgard2026.org"
TS_ALLOWED_HOSTNAMES = "skovgard2026.org,www.skovgard2026.org"

# ---------- Preview environment (Pages preview, etc.) ----------
[env.preview]
[env.preview.vars]
CORS_ORIGINS = "https://skovgard2026.pages.dev"
TS_ALLOWED_HOSTNAMES = "skovgard2026.pages.dev"

# ---------- D1 binding (shared across envs) ----------
[[d1_databases]]
binding = "DB"
database_name = "ballot_sources"
database_id   = "9c4b0c27-eb33-46e6-a477-fb49d4c81474"

# Optional: custom route when you attach a subdomain later
# [[routes]]
# pattern   = "api.skovgard2026.org/*"
# zone_name = "skovgard2026.org"
