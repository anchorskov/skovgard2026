name = "skovgard2026-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# ---------- Shared defaults ----------
[vars]
# Browsers allowed to call our API
CORS_ORIGINS = "http://localhost:1313,https://skovgard2026.org,https://skovgard2026.pages.dev"
# Hostnames accepted from Turnstile Siteverify
TS_ALLOWED_HOSTNAMES = "localhost,127.0.0.1,skovgard2026.org,www.skovgard2026.org,skovgard2026.pages.dev"
# Public media CDN for podcasts/audio assets
MEDIA_BASE_URL = "https://media.skovgard2026.org"
GCAL_PUBLIC_ICS_URL = "https://calendar.google.com/calendar/ical/38a0e5d50371ca9fd7f5c39451b12f3fcc571e8465dd8a8a092f0ca8ca587512%40group.calendar.google.com/public/basic.ics"

# ---------- Production environment ----------
[env.production]
[env.production.vars]
CORS_ORIGINS = "https://skovgard2026.org"
TS_ALLOWED_HOSTNAMES = "skovgard2026.org,www.skovgard2026.org"
MEDIA_BASE_URL = "https://media.skovgard2026.org"
STRIPE_PUBLISHABLE_KEY = "pk_live_51Son0YIfsL5VU7kUc0Ux82IBA80IuVchE5qJz4UIiJEOLTe06wKPuFRDiMZ4wvYgPinz0AGmrpnZ5EUuVm3sQAkK00Fohb6wLr"
GCAL_PUBLIC_ICS_URL = "https://calendar.google.com/calendar/ical/38a0e5d50371ca9fd7f5c39451b12f3fcc571e8465dd8a8a092f0ca8ca587512%40group.calendar.google.com/public/basic.ics"

[[env.production.d1_databases]]
binding = "DB"
database_name = "ballot_sources"
database_id   = "9c4b0c27-eb33-46e6-a477-fb49d4c81474"

# ---------- Preview environment (Pages preview, etc.) ----------
[env.preview]
[env.preview.vars]
CORS_ORIGINS = "https://skovgard2026.pages.dev"
TS_ALLOWED_HOSTNAMES = "skovgard2026.pages.dev"
MEDIA_BASE_URL = "https://media.skovgard2026.org"
# Use test key in preview to prevent accidental live charges

[[env.preview.d1_databases]]
binding = "DB"
database_name = "ballot_sources"
database_id   = "9c4b0c27-eb33-46e6-a477-fb49d4c81474"


# ---------- D1 binding (shared across envs) ----------
[[d1_databases]]
binding = "DB"
database_name = "ballot_sources"
database_id   = "9c4b0c27-eb33-46e6-a477-fb49d4c81474"

# Routes: attach Worker to /api/* paths on production domains
[[routes]]
pattern = "www.skovgard2026.org/api/*"
zone_name = "skovgard2026.org"

[[routes]]
pattern = "skovgard2026.org/api/*"
zone_name = "skovgard2026.org"
