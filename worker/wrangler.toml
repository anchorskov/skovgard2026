# worker/wrangler.toml
name = "skovgard2026-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# ---------- Shared defaults ----------
[vars]
# Browsers allowed to call our API
CORS_ORIGINS = "http://localhost:1313,http://localhost:4321,https://skovgard2026.org,https://skovgard2026.pages.dev"
# Hostnames accepted from Turnstile Siteverify
TS_ALLOWED_HOSTNAMES = "localhost,127.0.0.1,skovgard2026.org,www.skovgard2026.org,skovgard2026.pages.dev"
# Public media CDN for podcasts/audio assets
MEDIA_BASE_URL = "https://media.skovgard2026.org"
GCAL_PUBLIC_ICS_URL = "https://calendar.google.com/calendar/ical/38a0e5d50371ca9fd7f5c39451b12f3fcc571e8465dd8a8a092f0ca8ca587512%40group.calendar.google.com/public/basic.ics"
TELNYX_WEBHOOK_TOLERANCE_SECONDS = "300"
TELNYX_ALLOW_REACTIVATION = "1"
TELNYX_ALLOW_INSECURE_LOCAL_WEBHOOKS = "0"
TEXTING_WELCOME_ENABLED = "0"
TEXTING_WELCOME_TEXT = ""
PULSE_TEXT_WELCOME_ENABLED = "0"
PULSE_TEXT_WELCOME_TEXT = "Thanks for joining Text Messaging from Team Jimmy. We'll send occasional campaign updates. Reply STOP to opt out, HELP for help. If you gave us your email, check your inbox (and spam/junk folder) for a welcome message."
ADMIN_EMAIL_ENABLED = "1"
ADMIN_EMAIL_FROM = "support@grassrootsmvt.org"
INBOUND_SMS_NOTIFY_TO = "support@grassrootsmvt.org"
SHARE_ENABLED = "0"
PULSE_EMAIL_ENABLED = "0"
PULSE_STAFF_NOTIFY_TO = "pulse@grassrootsmvt.org"
PULSE_EMAIL_FROM = "pulse@grassrootsmvt.org"
PULSE_EMAIL_CAMPAIGN_NAME = "Skovgard for Senate"
# grassmvt_survey's own production base URL -- server-to-server target for
# POST /api/poll/admin/mint-invite-token during a poll_invite_2026 blast send.
GRASSMVT_SURVEY_BASE_URL = "https://grassrootsmvt.org"

