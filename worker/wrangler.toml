database_name       = "wy"
database_id         = "4b4227f1-bf30-4fcf-8a08-6967b536a5ab"

# Scheduled EmailListVerify batch job (email_verification_queue, migration
# 029) -- every 2 minutes, up to 36 addresses/tick (reduced from 45 to 30 on
# 2026-07-11 after monitoring showed a real tick overlapping into the next
# boundary, then raised to 36 the same day after 30 proved safe). See
# docs/blast_tracking.md.
#
# Re-enabled 2026-07-15 after runEmailVerificationBatch was fixed to give up
# on an address (status='verify_timeout') after EMAIL_VERIFICATION_MAX_ATTEMPTS
# consecutive failures instead of retrying it every tick forever -- see
# migration 033 and worker/src/index.js. Was briefly disabled the same day
# after a fixed set of ~18 slow/small mail-server addresses were found
# permanently occupying the front of the unchecked queue.
[env.production.triggers]
crons = ["*/2 * * * *"]

