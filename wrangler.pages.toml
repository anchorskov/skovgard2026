name = "skovgard2026"
compatibility_date = "2024-11-01"

[build]
command = "npm run build"
output_dir = "dist"
watch_paths = ["src/**", "content/**", "static/**", "astro.config.mjs"]

[env.production]
name = "skovgard2026"
routes = [
  { pattern = "skovgard2026.org/*", zone_name = "skovgard2026.org" },
  { pattern = "www.skovgard2026.org/*", zone_name = "skovgard2026.org" }
]

[observability]
enabled = true
