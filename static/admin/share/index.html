<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Bulk Share Send</title>
  <link rel="stylesheet" href="/css/global.css?v=1">
  <style>
    body { background: #f1ece1; font-family: 'Source Sans 3', Arial, sans-serif; color: #2b2b2b; margin: 0; padding: 24px 16px; }
    .shell { max-width: 680px; margin: 0 auto; }
    h1 { font-family: 'Bitter', Georgia, serif; font-size: 1.6rem; color: #2b2b2b; margin: 0 0 4px; }
    .sub { font-size: 0.875rem; color: #6b7280; margin: 0 0 28px; }
    label { display: block; font-size: 0.8125rem; font-weight: 700; color: #374151; margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; box-sizing: border-box;
      padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 0.9375rem; color: #2b2b2b; background: #fff;
      margin-bottom: 18px;
    }
    textarea { min-height: 140px; resize: vertical; font-family: ui-monospace, monospace; font-size: 0.8125rem; }
    #admin-share-shell .button-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    #admin-share-shell .button-row button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 2.75rem; padding: .6rem 1.4rem;
      border: 1px solid #2563eb; border-radius: .7rem;
      background: #2563eb; color: #fff; font-weight: 700; font-size: 0.9375rem;
      cursor: pointer;
    }
    #admin-share-shell .button-row button:disabled { opacity: 0.5; cursor: not-allowed; }
    #admin-share-shell .button-row button.secondary {
      background: #f1ece1; color: #2b2b2b; border-color: #6b7280;
    }
    .progress-bar-wrap { background: #e5e7eb; border-radius: 999px; height: 10px; margin: 16px 0 8px; }
    .progress-bar-fill { height: 10px; border-radius: 999px; background: #2563eb; transition: width 0.3s; width: 0%; }
    #status-box { font-size: 0.875rem; line-height: 1.6; margin-top: 14px; white-space: pre-wrap; }
    #status-box.error { color: #991b1b; }
    #status-box.success { color: #166534; }
    .kicker { font-size: 0.6875rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #c68a4a; margin-bottom: 18px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 24px; margin-bottom: 24px; }
    .nav-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; font-weight: 700; color: #6b7280; text-decoration: none; margin-bottom: 20px; }
    .nav-link:hover { color: #b22234; }
    .key-hint { font-size: 0.8125rem; border-left: 3px solid #c68a4a; padding: 6px 10px; background: #fdf8f1; border-radius: 0 6px 6px 0; margin-top: -14px; margin-bottom: 14px; color: #374151; }
    .key-hint code { font-family: ui-monospace, monospace; font-size: 0.75rem; background: #f1ece1; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
<div class="shell" id="admin-share-shell">

  <a href="/admin/emails/index.html" class="nav-link">← Emails admin</a>

  <h1>Bulk Share Send</h1>
  <p class="sub">Admin tool — sends share emails in batches of 10, bypassing the public rate limit.</p>

  <div class="card">
    <p class="kicker">Configuration</p>

    <label for="cfg-key">Admin key</label>
    <input id="cfg-key" type="password" placeholder="SHARE_ADMIN_KEY value" autocomplete="off" />

    <label for="cfg-slug">Email type or share message</label>
    <select id="cfg-slug">
      <option value="__custom__">Regular email</option>
      <option value="" disabled>Loading share messages…</option>
    </select>
    <div id="slug-load-err" style="display:none;font-size:0.8125rem;color:#991b1b;margin-top:-14px;margin-bottom:10px;"></div>

    <div id="custom-email-fields" hidden>
      <label for="cfg-subject">Subject line</label>
      <input id="cfg-subject" type="text" placeholder="Write the subject line" maxlength="180" />

      <label for="cfg-body">Email body</label>
      <textarea id="cfg-body" placeholder="Write the email body"></textarea>
    </div>

    <label for="cfg-sender">Sender name <span style="font-weight:400;color:#9ca3af">(optional)</span></label>
    <input id="cfg-sender" type="text" placeholder="e.g. Jimmy Skovgard" maxlength="80" />
  </div>

  <div class="card">
    <p class="kicker">Recipients</p>

    <label for="cfg-source">Recipient source</label>
    <select id="cfg-source">
      <option value="paste">Paste your own</option>
      <option value="candidates">Candidates — voter guide (1,814 with email)</option>
      <option value="optins">Email opt-ins — campaign contacts</option>
    </select>

    <div id="load-key-row" hidden>
      <label id="load-key-label" for="cfg-load-key">Load key</label>
      <input id="cfg-load-key" type="password" placeholder="Enter the key for this source" autocomplete="off" />
      <p id="load-key-hint" class="key-hint"></p>
      <div class="button-row" style="margin-bottom:14px;">
        <button id="btn-load" type="button">Load list</button>
      </div>
      <p id="load-status" style="font-size:0.8125rem;margin-bottom:14px;" role="status" aria-live="polite"></p>
    </div>

    <label for="cfg-emails">Email addresses — one per line, or comma/semicolon separated</label>
    <textarea id="cfg-emails" placeholder="alice@example.com&#10;bob@example.com&#10;carol@example.com"></textarea>
    <div id="parsed-count" style="font-size:0.8125rem;color:#6b7280;margin-top:-14px;margin-bottom:18px;"></div>
  </div>

  <div class="card">
    <p class="kicker">Send</p>
    <div class="progress-bar-wrap" id="progress-wrap" style="display:none">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
    <div id="progress-label" style="font-size:0.8125rem;color:#6b7280;margin-bottom:8px;display:none;"></div>
    <div class="button-row">
      <button id="btn-send" type="button">Send all</button>
      <button id="btn-copy-failed" type="button" class="secondary" style="display:none">Copy failed addresses</button>
      <button id="btn-reset" type="button" class="secondary">Reset</button>
    </div>
    <div id="status-box"></div>
  </div>

</div>

<script>
(function () {
  const BATCH = 5;

  const keyEl       = document.getElementById('cfg-key');
  const slugEl      = document.getElementById('cfg-slug');

  // --- Recipient source loader ---
  const sourceEl     = document.getElementById('cfg-source');
  const loadKeyRow   = document.getElementById('load-key-row');
  const loadKeyLabel = document.getElementById('load-key-label');
  const loadKeyEl    = document.getElementById('cfg-load-key');
  const loadKeyHint  = document.getElementById('load-key-hint');
  const loadBtn      = document.getElementById('btn-load');
  const loadStatus   = document.getElementById('load-status');

  const SOURCE_META = {
    candidates: {
      label: 'Candidates admin key',
      hint: 'Uses <code>CANDIDATES_ADMIN_KEY</code> — the secret on the <code>skovgard-candidates</code> Worker.',
      fetch: async (key) => {
        const url = new URL('https://candidates.skovgard2026.org/api/admin/candidate-emails');
        url.searchParams.set('key', key);
        const resp = await fetch(url, { headers: { accept: 'application/json' } });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || !data.ok) throw new Error(data.error || `HTTP ${resp.status}`);
        return data.emails;
      },
    },
    optins: {
      label: 'Campaign admin key',
      hint: 'Uses <code>ADMIN_EXPORT_KEY</code> — the secret on the <code>skovgard2026-api</code> Worker.',
      fetch: async (key) => {
        const url = new URL('/api/admin/emails/contacts', location.origin);
        url.searchParams.set('key', key);
        url.searchParams.set('filter', 'emailable');
        url.searchParams.set('limit', '5000');
        const resp = await fetch(url, { headers: { accept: 'application/json' } });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || !data.ok) throw new Error(data.error || `HTTP ${resp.status}`);
        return (data.items || []).map(c => c.email).filter(Boolean);
      },
    },
  };

  function updateSourceUi() {
    const src = sourceEl.value;
    const meta = SOURCE_META[src];
    if (!meta) { loadKeyRow.hidden = true; return; }
    loadKeyRow.hidden = false;
    loadKeyLabel.textContent = meta.label;
    loadKeyEl.placeholder = `Enter the ${meta.label}`;
    loadKeyHint.innerHTML = meta.hint;
    loadStatus.textContent = '';
  }

  sourceEl.addEventListener('change', updateSourceUi);

  loadBtn.addEventListener('click', async () => {
    const src = sourceEl.value;
    const meta = SOURCE_META[src];
    if (!meta) return;
    const key = loadKeyEl.value.trim();
    if (!key) { loadStatus.textContent = `Enter the ${meta.label} first.`; return; }

    loadBtn.disabled = true;
    loadStatus.textContent = 'Loading…';
    try {
      const emails = await meta.fetch(key);
      if (!emails.length) { loadStatus.textContent = 'No emails returned.'; return; }
      emailsEl.value = emails.join('\n');
      updateCount();
      loadStatus.textContent = `✓ Loaded ${emails.length} address${emails.length !== 1 ? 'es' : ''}.`;
    } catch (err) {
      loadStatus.textContent = `Error: ${err.message}`;
    } finally {
      loadBtn.disabled = false;
    }
  });
  // --- end recipient source loader ---
  const slugErrEl   = document.getElementById('slug-load-err');
  const customFieldsEl = document.getElementById('custom-email-fields');
  const subjectEl   = document.getElementById('cfg-subject');
  const bodyEl      = document.getElementById('cfg-body');
  const CUSTOM_EMAIL_VALUE = '__custom__';

  function isCustomEmail() {
    return slugEl.value === CUSTOM_EMAIL_VALUE;
  }

  function updateEmailTypeUi() {
    customFieldsEl.hidden = !isCustomEmail();
  }

  // Populate message dropdown from Worker registry
  (async () => {
    try {
      const resp = await fetch('/api/share/messages');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const { messages } = await resp.json();
      slugEl.innerHTML = [
        `<option value="${CUSTOM_EMAIL_VALUE}">Regular email</option>`,
        ...messages.map(m => `<option value="${m.slug}">${m.title}</option>`),
      ].join('');
      updateEmailTypeUi();
    } catch (err) {
      slugErrEl.textContent = 'Could not load message list — is the Worker running? (' + err.message + ')';
      slugErrEl.style.display = '';
      slugEl.innerHTML = `<option value="${CUSTOM_EMAIL_VALUE}">Regular email</option><option value="" disabled>— share messages failed to load —</option>`;
      updateEmailTypeUi();
    }
  })();
  slugEl.addEventListener('change', updateEmailTypeUi);
  const senderEl  = document.getElementById('cfg-sender');
  const emailsEl  = document.getElementById('cfg-emails');
  const countEl   = document.getElementById('parsed-count');
  const sendBtn       = document.getElementById('btn-send');
  const resetBtn      = document.getElementById('btn-reset');
  const copyFailedBtn = document.getElementById('btn-copy-failed');
  const statusEl      = document.getElementById('status-box');
  const progressWrap  = document.getElementById('progress-wrap');
  const progressFill  = document.getElementById('progress-fill');
  const progressLabel = document.getElementById('progress-label');

  function parseEmails(raw) {
    return [...new Set(
      raw.split(/[\n,;]+/)
        .map(e => e.trim().toLowerCase())
        .filter(e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e))
    )];
  }

  function updateCount() {
    const emails = parseEmails(emailsEl.value);
    const batches = Math.ceil(emails.length / BATCH);
    countEl.textContent = emails.length > 0
      ? `${emails.length} valid address${emails.length !== 1 ? 'es' : ''} — ${batches} batch${batches !== 1 ? 'es' : ''} of ${BATCH}`
      : '';
  }

  emailsEl.addEventListener('input', updateCount);

  function setStatus(msg, type = '') {
    statusEl.className = type;
    statusEl.textContent = msg;
  }

  async function sendBatch(recipients, adminKey, slug, senderName, customEmail) {
    const payload = {
      sender_name: senderName,
      recipients,
      admin_key: adminKey,
      _t: Date.now(),
    };
    if (customEmail) {
      payload.email_mode = 'custom';
      payload.subject = subjectEl.value.trim();
      payload.body = bodyEl.value.trim();
    } else {
      payload.message_slug = slug;
    }
    const resp = await fetch('/api/share', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await resp.json().catch(() => ({}));
    return { ok: resp.ok && data.ok, sent: data.sent || 0, failed_emails: data.failed_emails || [], error: data.error || null, status: resp.status };
  }

  async function sendBatchWithRetry(recipients, adminKey, slug, senderName, customEmail) {
    const first = await sendBatch(recipients, adminKey, slug, senderName, customEmail);
    // If entire batch failed (HTTP 500 / rate limit), wait 10s and retry once
    if (!first.ok && first.status === 500) {
      await new Promise(r => setTimeout(r, 10000));
      return sendBatch(recipients, adminKey, slug, senderName, customEmail);
    }
    return first;
  }

  sendBtn.addEventListener('click', async () => {
    const adminKey  = keyEl.value.trim();
    const slug      = slugEl.value;
    const sender    = senderEl.value.trim();
    const emails    = parseEmails(emailsEl.value);
    const customEmail = isCustomEmail();

    if (!adminKey) { setStatus('Enter the admin key.', 'error'); return; }
    if (!customEmail && !slug) { setStatus('Select a share message.', 'error'); return; }
    if (customEmail && !subjectEl.value.trim()) { setStatus('Enter a subject line for the regular email.', 'error'); return; }
    if (customEmail && !bodyEl.value.trim()) { setStatus('Enter the regular email body.', 'error'); return; }
    if (emails.length === 0) { setStatus('No valid email addresses found.', 'error'); return; }

    sendBtn.disabled = true;
    setStatus('');
    progressWrap.style.display = '';
    progressLabel.style.display = '';
    copyFailedBtn.style.display = 'none';

    const batches = [];
    for (let i = 0; i < emails.length; i += BATCH) {
      batches.push(emails.slice(i, i + BATCH));
    }

    let totalSent = 0;
    const allFailed = [];
    const batchErrors = [];

    for (let i = 0; i < batches.length; i++) {
      const pct = Math.round((i / batches.length) * 100);
      progressFill.style.width = pct + '%';
      progressLabel.textContent = `Batch ${i + 1} of ${batches.length} — ${totalSent} sent so far…`;

      try {
        const result = await sendBatchWithRetry(batches[i], adminKey, slug, sender, customEmail);
        if (result.ok) {
          totalSent += result.sent || batches[i].length;
          if (result.failed_emails.length) {
            allFailed.push(...result.failed_emails);
          }
        } else {
          allFailed.push(...batches[i]);
          batchErrors.push(`Batch ${i + 1}: ${result.error || 'unknown error'} (HTTP ${result.status})`);
        }
      } catch (err) {
        allFailed.push(...batches[i]);
        batchErrors.push(`Batch ${i + 1}: network error — ${err.message}`);
      }

      // 2s pause between batches to stay within Resend rate limits
      if (i < batches.length - 1) {
        await new Promise(r => setTimeout(r, 2000));
      }
    }

    progressFill.style.width = '100%';
    progressLabel.style.display = 'none';

    const summary = `Done. ${totalSent} sent, ${allFailed.length} failed out of ${emails.length} total.`;
    let detail = '';
    if (batchErrors.length) detail += '\n\nBatch errors:\n' + batchErrors.join('\n');
    if (allFailed.length) {
      detail += `\n\nFailed addresses (${allFailed.length}):`;
      copyFailedBtn.style.display = 'inline-flex';
      copyFailedBtn.dataset.emails = allFailed.join('\n');
    }
    setStatus(summary + detail, allFailed.length === 0 ? 'success' : 'error');
    sendBtn.disabled = false;
  });

  resetBtn.addEventListener('click', () => {
    emailsEl.value = '';
    senderEl.value = '';
    subjectEl.value = '';
    bodyEl.value = '';
    countEl.textContent = '';
    progressWrap.style.display = 'none';
    progressLabel.style.display = 'none';
    progressFill.style.width = '0%';
    copyFailedBtn.style.display = 'none';
    copyFailedBtn.dataset.emails = '';
    setStatus('');
    sendBtn.disabled = false;
    loadKeyEl.value = '';
    loadStatus.textContent = '';
    sourceEl.value = 'paste';
    updateSourceUi();
  });

  copyFailedBtn.addEventListener('click', async () => {
    const text = copyFailedBtn.dataset.emails || '';
    try {
      await navigator.clipboard.writeText(text);
      const orig = copyFailedBtn.textContent;
      copyFailedBtn.textContent = 'Copied!';
      setTimeout(() => { copyFailedBtn.textContent = orig; }, 2000);
    } catch {
      prompt('Copy these failed addresses:', text);
    }
  });
})();
</script>
</body>
</html>
