# Candidates/wrangler.toml
name = "skovgard-candidates"
account_id = "8bfd3f60fbdcc89183e9e312fb03e86e"
compatibility_date = "2025-09-30"

# ---------- Production defaults (used by wrangler deploy) ----------
[vars]
ENVIRONMENT = "production"
ALLOW_ORIGIN = "https://candidates.skovgard2026.org"
GOOGLE_CIVIC_ELECTION_ID = ""
TURNSTILE_SITE_KEY = "0x4AAAAAADsXNM0u3sbiGhhl"
QUESTIONNAIRE_EMAIL_FROM = "profile@updates.grassrootsmvt.org"

# RESEND_API_KEY and TURNSTILE_SECRET_KEY are secrets, not vars — set with:
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put TURNSTILE_SECRET_KEY
# Without RESEND_API_KEY, /api/questionnaire/request still responds success
# (to avoid leaking which candidates have an email on file) but sends no mail.
#
# QUESTIONNAIRE_EMAIL_FROM must stay on updates.grassrootsmvt.org (or another
# domain confirmed verified in the Resend account this RESEND_API_KEY
# belongs to) — confirmed 2026-08-04 that bare grassrootsmvt.org is NOT
# verified there: Resend rejected every send with a 403 "domain is not
# verified" validation_error. This silently broke both the ballot-recovery
# email and the candidate questionnaire invite email (same var, same code
# path) until caught. See Candidates/docs/ballot_recovery.md.

[[d1_databases]]
binding = "WY_DB"
database_name = "wy"
database_id = "4b4227f1-bf30-4fcf-8a08-6967b536a5ab"
migrations_dir = "db/migrations"

[[d1_databases]]
binding = "LOOKUP_DB"
database_name = "ballot_sources"
database_id = "9c4b0c27-eb33-46e6-a477-fb49d4c81474"

[[kv_namespaces]]
binding = "SESSION"
id = "ad77fc90ea384e0f95e14094be3600fa"
