<div class="footer-extras" role="navigation" aria-label="Footer">
  <a href="/feedback/" class="feedback-btn">Give Feedback</a>

  {{ with site.Params.contactEmail }}
    <div class="footer-contact">
      <a href="mailto:{{ . }}">{{ . }}</a>
    </div>
  {{ end }}

  {{ if .Site.Menus.footer }}
    <nav class="footer-nav">
      {{ range .Site.Menus.footer }}
        <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  {{ end }}

  {{ if site.Params.socialIcons }}
    <div class="footer-social">
      {{ partial "social_icons.html" (dict "align" "center") }}
    </div>
  {{ end }}
</div>
