{{/* layouts/events/single.html */}}
{{- define "main" }}

<link rel="stylesheet" href="/css/events.css" />

<section class="events">
  <div class="events-wrap">
    <header class="events-header">
      <h1>{{ .Title }}</h1>
      {{ with .Content }}<div class="events-intro">{{ . }}</div>{{ end }}
    </header>

    <iframe
      class="events-calendar"
      src="https://calendar.google.com/calendar/embed?src=38a0e5d50371ca9fd7f5c39451b12f3fcc571e8465dd8a8a092f0ca8ca587512%40group.calendar.google.com&ctz=America%2FDenver"
      style="border:0"
      width="100%"
      height="700"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      title="Campaign Events Calendar"></iframe>
  </div>
</section>

{{- end }}
